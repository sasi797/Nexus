server {
    listen 80;
    server_name nexus-api.linkworks.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nexus-api.linkworks.in;

    ssl_certificate     /etc/letsencrypt/live/nexus-api.linkworks.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexus-api.linkworks.in/privkey.pem;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;

        # Fallback CORS headers — ensures browser can read error responses
        # even when the FastAPI app fails before its own CORS middleware fires.
        add_header 'Access-Control-Allow-Origin'  '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'      '$http_origin';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers'     'Authorization, Content-Type';
            add_header 'Access-Control-Max-Age'           1728000;
            add_header 'Content-Type'                     'text/plain; charset=utf-8';
            add_header 'Content-Length'                   0;
            return 204;
        }
    }
}
